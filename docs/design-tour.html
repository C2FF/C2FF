<!doctype html>
<!-- C2FF design tour - REAL screenshots of the running console.
     Self-contained, no external resource. Tabs / arrows / digits: switch screen.
     Drag the image to pan (grab cursor), wheel to zoom, double-click to reset. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C2FF - console gallery</title>
<style>
:root{
  --bg:#070a07; --panel:#0e1310; --panel2:#121814; --line:#232d25; --linehi:#374538;
  --g:#39ff14; --txt:#d8e6d4; --gsoft:rgba(57,255,20,.13); --dim:#8fa38a; --faint:#5a6b58;
  --mono:ui-monospace,'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.022) 0 4px,transparent 4px 8px),
    repeating-linear-gradient(-45deg,rgba(255,255,255,.022) 0 4px,transparent 4px 8px),
    radial-gradient(1200px 500px at 85% -10%,rgba(57,255,20,.07),transparent 60%),
    var(--bg);
  color:var(--txt); font-family:var(--mono); font-size:14px; line-height:1.55;
  display:flex; flex-direction:column; min-height:100vh; overflow:hidden;
}
header{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
header b{font-size:17px;letter-spacing:.14em;color:var(--g);text-shadow:0 0 14px rgba(57,255,20,.4)}
header span{color:var(--faint);font-size:11.5px}
header .right{margin-left:auto;color:var(--faint);font-size:11px;text-align:right}
main{flex:1;display:flex;flex-direction:column;padding:10px 14px 6px;gap:8px;min-height:0}
.rail{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;flex:none}
.rail button{
  background:none;border:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:10.5px;
  padding:4px 11px;border-radius:3px;cursor:pointer;letter-spacing:.06em
}
.rail button:hover{color:var(--txt);border-color:var(--linehi)}
.rail button.on{color:var(--g);border-color:var(--g);background:var(--gsoft)}
#stage{
  flex:1;min-height:0;position:relative;overflow:hidden;border:1px solid var(--linehi);border-radius:6px;
  background:var(--panel);box-shadow:0 14px 40px rgba(0,0,0,.55);
  cursor:grab; touch-action:none;
}
#stage.drag{cursor:grabbing}
#shot{
  position:absolute;top:0;left:0;display:block;
  transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none;
}
#lbl{
  position:absolute;left:10px;top:8px;background:rgba(7,10,7,.82);border:1px solid var(--line);
  color:var(--g);font-size:10.5px;letter-spacing:.08em;padding:3px 10px;border-radius:3px;pointer-events:none
}
#zoom{
  position:absolute;right:10px;bottom:10px;background:rgba(7,10,7,.82);border:1px solid var(--line);
  color:var(--faint);font-size:10px;padding:3px 9px;border-radius:3px;pointer-events:none
}
.tools{position:absolute;right:10px;top:8px;display:flex;gap:4px}
.tools button{
  background:rgba(7,10,7,.82);border:1px solid var(--linehi);color:var(--g);border-radius:3px;
  font-family:var(--mono);font-size:11px;width:28px;height:24px;cursor:pointer
}
.tools button:hover{border-color:var(--g)}
.foot{display:flex;gap:10px;align-items:center;justify-content:center;padding:8px 0 10px;flex:none}
.foot span{color:var(--faint);font-size:10px;letter-spacing:.08em}
.foot button{width:40px;height:26px;border:1px solid var(--linehi);background:var(--panel);color:var(--g);border-radius:4px;cursor:pointer;font-size:12px}
.foot button:hover{border-color:var(--g)}
</style>
</head>
<body>

<header>
  <b>C2FF</b>
  <span>real console gallery - eight tabs, one working session (fresh workspace, example program)</span>
  <span class="right">drag the image to move it - wheel to zoom<br>&larr; &rarr; or the digits, to switch tab</span>
</header>

<main>
  <div class="rail" id="rail"></div>
  <div id="stage">
    <img id="shot" alt="C2FF console">
    <div id="lbl"></div>
    <div class="tools">
      <button id="zin" title="zoom +">+</button>
      <button id="zout" title="zoom -">-</button>
      <button id="zrst" title="reset">&#8634;</button>
    </div>
    <div id="zoom">100%</div>
  </div>
  <div class="foot">
    <button onclick="go(cur-1)" aria-label="previous">&#8592;</button>
    <span id="pos"></span>
    <button onclick="go(cur+1)" aria-label="next">&#8594;</button>
  </div>
</main>

<script>
const SHOTS = [
  ['live.jpg',     'LIVE',      'the console at rest: header, badge, tabs, live counters'],
  ['findings.jpg', 'FINDINGS',  'every signal, triaged - status selector, AI second opinion'],
  ['programs.jpg', 'PROGRAMS',  'declare a program (scope + header), pick a mode, GO'],
  ['hunt.jpg',     'HUNT',      'the three-phase pipeline: RECON, ATTACK, PLAN - with proof'],
  ['ai.jpg',       'AI',        'optional gateway: OpenAI-compatible / Ollama / Anthropic'],
  ['team.jpg',     'TEAM',      'one click to a shared room: invite link, roles, key'],
  ['term.jpg',     'TERM',      'the engine output as it happens'],
  ['chat.jpg',     'CHAT',      'coordination channel toward your wired agent']
];
const rail = document.getElementById('rail'), shot = document.getElementById('shot'),
      stage = document.getElementById('stage'), lbl = document.getElementById('lbl'),
      pos = document.getElementById('pos'), zin = document.getElementById('zoom');
rail.innerHTML = SHOTS.map((s,i)=>'<button data-i="'+i+'">'+String(i+1)+' '+s[1]+'</button>').join('');
let cur = -1;
/* viewport + pan state */
let sc = 1, tx = 0, ty = 0, dragging = false, dx = 0, dy = 0;
function apply(){ shot.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+sc+')'; zin.textContent = Math.round(sc*100)+'%'; }
function fit(){ sc = Math.min(stage.clientWidth/shot.naturalWidth, 1); sc = Math.max(sc, .05); tx = (stage.clientWidth - shot.naturalWidth*sc)/2; ty = 14; apply(); }
function go(i){
  i = Math.max(0, Math.min(SHOTS.length-1, i));
  if (i === cur) return;
  cur = i;
  [...rail.children].forEach((b,k)=>b.classList.toggle('on', k===cur));
  lbl.textContent = SHOTS[cur][1] + ' - ' + SHOTS[cur][2];
  pos.textContent = String(cur+1)+' / '+SHOTS.length;
  shot.src = 'assets/shots/' + SHOTS[cur][0];
}
shot.onload = () => { lbl.style.visibility='visible'; fit(); };
window.addEventListener('resize', fit);
/* wheel zoom around the pointer */
stage.addEventListener('wheel', e=>{
  e.preventDefault();
  const r = stage.getBoundingClientRect(), mx = e.clientX-r.left, my = e.clientY-r.top;
  const k = e.deltaY < 0 ? 1.15 : 1/1.15, ns = Math.max(.1, Math.min(6, sc*k));
  tx = mx - (mx - tx) * ns / sc; ty = my - (my - ty) * ns / sc; sc = ns; apply();
}, {passive:false});
/* grab & pan - the cursor becomes the hand that moves the image */
stage.addEventListener('mousedown', e=>{
  e.preventDefault(); dragging = true; dx = e.clientX-tx; dy = e.clientY-ty; stage.classList.add('drag');
});
window.addEventListener('mousemove', e=>{ if(!dragging) return; tx = e.clientX-dx; ty = e.clientY-dy; apply(); });
window.addEventListener('mouseup', ()=>{ dragging = false; stage.classList.remove('drag'); });
stage.addEventListener('dblclick', ()=>fit());
document.getElementById('zin').onclick = ()=>{ const s=Math.min(6,sc*1.25); tx*=s/sc; ty*=s/sc; sc=s; apply(); };
document.getElementById('zout').onclick = ()=>{ const s=Math.max(.1,sc/1.25); tx*=s/sc; ty*=s/sc; sc=s; apply(); };
document.getElementById('zrst').onclick = ()=>fit();
/* keyboard: arrows switch screen, digits jump, +/- zoom */
document.addEventListener('keydown', e=>{
  if (e.key==='ArrowRight'||e.key==='ArrowDown') go(cur+1);
  if (e.key==='ArrowLeft'||e.key==='ArrowUp') go(cur-1);
  const n = parseInt(e.key,10);
  if (n>=1 && n<=SHOTS.length) go(n-1);
  if (e.key==='+'||e.key==='=') document.getElementById('zin').onclick();
  if (e.key==='-') document.getElementById('zout').onclick();
});
rail.addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) go(+b.dataset.i); });
/* touch drag */
stage.addEventListener('touchstart', e=>{ const t=e.touches[0]; dragging=true; dx=t.clientX-tx; dy=t.clientY-ty; stage.classList.add('drag'); }, {passive:true});
stage.addEventListener('touchmove', e=>{ if(!dragging) return; const t=e.touches[0]; tx=t.clientX-dx; ty=t.clientY-dy; apply(); e.preventDefault(); }, {passive:false});
stage.addEventListener('touchend', ()=>{ dragging=false; stage.classList.remove('drag'); });
go(0);
</script>
</body>
</html>
